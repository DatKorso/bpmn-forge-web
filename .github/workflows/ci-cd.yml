name: CI/CD

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  build:
    name: Test and build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Archive production build
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: |
          printf '%s\n' "$GITHUB_SHA" > dist/deployment-version.txt
          tar -czf bpmn-forge.tar.gz -C dist .
      - uses: actions/upload-artifact@v7
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        with:
          name: bpmn-forge
          path: bpmn-forge.tar.gz
          if-no-files-found: error
          retention-days: 7
          overwrite: true

  deploy:
    name: Deploy to VPS
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: production
      url: https://bpmn.korso.cc
    permissions:
      contents: write
    concurrency:
      group: production-vps
      queue: max
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: bpmn-forge
          path: ${{ runner.temp }}/bpmn-forge
      - name: Publish build for the VPS
        id: publish
        run: |
          main_sha="$(git ls-remote --exit-code origin refs/heads/main | cut -f1)"
          if [[ "$main_sha" != "$GITHUB_SHA" ]]; then
            echo 'Skipping deployment because main has moved.'
            exit 0
          fi

          deploy_ref=refs/heads/production-build
          previous="$(git ls-remote origin "$deploy_ref" | cut -f1)"
          parent=()
          if [[ -n "$previous" ]]; then
            git fetch --no-tags --depth=1 origin "$previous"
            parent=(-p "$previous")
          fi

          export GIT_INDEX_FILE="$RUNNER_TEMP/bpmn-forge.index"
          git read-tree --empty
          bundle="$(git hash-object -w "$RUNNER_TEMP/bpmn-forge/bpmn-forge.tar.gz")"
          git update-index --add --cacheinfo "100644,$bundle,bpmn-forge.tar.gz"
          tree="$(git write-tree)"
          commit="$(git -c user.name='github-actions[bot]' \
            -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit-tree "$tree" "${parent[@]}" -m "Deploy $GITHUB_SHA")"
          git push origin "$commit:$deploy_ref"
          echo 'published=true' >> "$GITHUB_OUTPUT"
      - name: Verify public deployment
        if: steps.publish.outputs.published == 'true'
        run: |
          for attempt in {1..24}; do
            deployed="$(curl --fail --silent --max-time 5 \
              "https://bpmn.korso.cc/deployment-version.txt?sha=$GITHUB_SHA")" || deployed=
            if [[ "$deployed" == "$GITHUB_SHA" ]]; then
              echo "Verified deployment of $GITHUB_SHA"
              exit 0
            fi
            sleep 5
          done
          echo "The VPS did not serve revision $GITHUB_SHA in time." >&2
          exit 1
