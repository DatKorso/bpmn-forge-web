name: CI/CD

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Test and build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Archive production build
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: tar -czf bpmn-forge.tar.gz -C dist .
      - uses: actions/upload-artifact@v7
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        with:
          name: bpmn-forge
          path: bpmn-forge.tar.gz
          if-no-files-found: error
          retention-days: 7
          overwrite: true

  deploy:
    name: Deploy to VPS
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    concurrency:
      group: production-vps
      queue: max
    steps:
      - name: Check whether this commit is still on top of main
        id: revision
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          main_sha="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')"
          if [[ "$main_sha" == "$GITHUB_SHA" ]]; then
            echo 'current=true' >> "$GITHUB_OUTPUT"
          else
            echo 'Skipping deployment because main has moved.'
          fi
      - uses: actions/download-artifact@v8
        if: steps.revision.outputs.current == 'true'
        with:
          name: bpmn-forge
      - name: Publish over SSH
        if: steps.revision.outputs.current == 'true'
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ vars.VPS_PORT || '22' }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          : "${VPS_HOST:?Set the VPS_HOST environment secret}"
          : "${VPS_SSH_KEY:?Set the VPS_SSH_KEY environment secret}"
          : "${VPS_KNOWN_HOSTS:?Set the VPS_KNOWN_HOSTS environment secret}"

          ssh_dir="$(mktemp -d)"
          trap 'rm -rf -- "$ssh_dir"' EXIT
          umask 077
          printf '%s\n' "$VPS_SSH_KEY" > "$ssh_dir/key"
          printf '%s\n' "$VPS_KNOWN_HOSTS" > "$ssh_dir/known_hosts"

          ssh -T -i "$ssh_dir/key" -l bpmn-deploy -p "$VPS_PORT" \
            -o BatchMode=yes -o IdentitiesOnly=yes -o ConnectTimeout=15 \
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$ssh_dir/known_hosts" \
            -- "$VPS_HOST" bpmn-forge-publish < bpmn-forge.tar.gz
